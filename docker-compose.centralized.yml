services:
  postgres:
    image: ${SMART_GYM_POSTGRES_IMAGE:-smart-gym-postgres:portable}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SMART_GYM_DB_USER:-smartgym}
      POSTGRES_PASSWORD: ${SMART_GYM_DB_PASSWORD:-smartgym}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - smart-gym-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SMART_GYM_DB_USER:-smartgym} -d postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${SMART_GYM_BACKEND_IMAGE:-smart-gym-backend:portable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GYM_DB_ENGINE: postgres
      GYM_DB_NAME: gym_server_db
      GYM_DB_USER: ${SMART_GYM_DB_USER:-smartgym}
      GYM_DB_PASSWORD: ${SMART_GYM_DB_PASSWORD:-smartgym}
      GYM_DB_HOST: postgres
      GYM_DB_PORT: 5432
    ports:
      - "8000:8000"

  mirror:
    image: ${SMART_GYM_MIRROR_IMAGE:-smart-gym-mirror:portable}
    profiles: ["mirror"]
    restart: unless-stopped
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
      SMART_MIRROR_DB_BACKEND: postgres
      SMART_MIRROR_PG_DB: gym_main_db
      SMART_MIRROR_PG_USER: ${SMART_GYM_DB_USER:-smartgym}
      SMART_MIRROR_PG_PASSWORD: ${SMART_GYM_DB_PASSWORD:-smartgym}
      SMART_MIRROR_PG_HOST: postgres
      SMART_MIRROR_PG_PORT: 5432
      SMART_MIRROR_NODE_ROLE: MAIN
      SMART_GYM_SERVER_URL: http://backend:8000
      SMART_MIRROR_DISABLE_AUDIO_FEEDBACK: 1
      SMART_MIRROR_DISPLAY_FIT_MODE: ${SMART_MIRROR_DISPLAY_FIT_MODE:-cover}
      SMART_MIRROR_CAMERA_ROTATION: ${SMART_MIRROR_CAMERA_ROTATION:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    stdin_open: true
    tty: true

volumes:
  smart-gym-postgres:
